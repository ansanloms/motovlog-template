version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      timezone: "Asia/Tokyo"
    commit-message:
      prefix: "build"
      include: "scope"
    groups:
      react:
        patterns:
          - "react"
          - "react-dom"
          - "@types/react"
    # Remotion は apm.yml の remotion-dev/skills の固定 SHA と同期が要るため
    # Dependabot の対象外にし、手動で更新する (CLAUDE.md「skill の導入」参照)。
    # ignore は security update にも効くので、Remotion の脆弱性修正の PR も作られない。
    ignore:
      - dependency-name: "remotion"
      - dependency-name: "@remotion/*"
      # typescript 7 は scripts/voice/extract.ts が使う 5.x の compiler API を持たないため、
      # major 更新を対象外にする。
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      timezone: "Asia/Tokyo"
    commit-message:
      prefix: "ci"
