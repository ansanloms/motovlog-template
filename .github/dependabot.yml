version: 2

updates:
  # root の deno.json を見る。member (modules/*/deno.json) は root の
  # workspace から発見される。react は root と member の両方に exact pin が
  # あり、片方だけ上がると deno task check が落ちるため、group で 1 つの PR に
  # まとめる。
  - package-ecosystem: "deno"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      timezone: "Asia/Tokyo"
    commit-message:
      prefix: "build"
      include: "scope"
    groups:
      react:
        patterns:
          - "react"
          - "react-dom"
          - "@types/react"
    # Remotion は apm.yml の remotion-dev/skills の固定 SHA と同期が要るため
    # Dependabot の対象外にし、deno task upgrade で更新する (CLAUDE.md「skill の導入」参照)。
    # ignore は security update にも効くので、Remotion の脆弱性修正の PR も作られない。
    ignore:
      - dependency-name: "remotion"
      - dependency-name: "@remotion/*"
      # typescript 7 (native 実装) は 5.x のコンパイラ API (createSourceFile 等) を
      # 提供せず、scripts/voice/extract.ts が動かない。major は手で検討する。
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      timezone: "Asia/Tokyo"
    commit-message:
      prefix: "ci"
