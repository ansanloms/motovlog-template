version: 2

# react は package.json と modules/*/deno.json (exact pin) の両方にあり、
# 片方だけ上がると deno task check が落ちる。multi-ecosystem group で
# npm と deno を同じ PR にまとめる。
multi-ecosystem-groups:
  react:
    schedule:
      interval: "weekly"
      day: "monday"
      timezone: "Asia/Tokyo"
    commit-message:
      prefix: "build"
      include: "scope"

updates:
  # group に入れた entry には commit-message と groups を書けない (group 側に書く)。
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      timezone: "Asia/Tokyo"
    patterns:
      - "react"
      - "react-dom"
      - "@types/react"
    multi-ecosystem-group: "react"
    # Remotion は apm.yml の remotion-dev/skills の固定 SHA と同期が要るため
    # Dependabot の対象外にし、npm run upgrade で更新する (CLAUDE.md「skill の導入」参照)。
    # ignore は security update にも効くので、Remotion の脆弱性修正の PR も作られない。
    ignore:
      - dependency-name: "remotion"
      - dependency-name: "@remotion/*"

  - package-ecosystem: "deno"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      timezone: "Asia/Tokyo"
    patterns:
      - "react"
      - "react-dom"
      - "@types/react"
    multi-ecosystem-group: "react"
    # member (modules/*/deno.json) は root の workspace から発見される。
    # Remotion は npm 側と同じく対象外 (npm run upgrade が member の pin も揃える)。
    ignore:
      - dependency-name: "remotion"
      - dependency-name: "@remotion/*"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      timezone: "Asia/Tokyo"
    commit-message:
      prefix: "ci"
