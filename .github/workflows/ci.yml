name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint:node

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build

  modules-list:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      modules: ${{ steps.list.outputs.modules }}
    steps:
      - uses: actions/checkout@v7
      - id: list
        # deno.json を持つ member だけを matrix に入れる (root の deno task --members と同じ範囲)。
        run: echo "modules=$(find modules -mindepth 2 -maxdepth 2 -name deno.json -printf '%h\n' | xargs -n1 basename | sort | jq -R . | jq -sc .)" >> "$GITHUB_OUTPUT"

  modules:
    needs: modules-list
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        module: ${{ fromJSON(needs.modules-list.outputs.modules) }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - uses: denoland/setup-deno@v2.0.5
        with:
          deno-version: "2.9.6"
      # member の npm: 依存は root の nodeModulesDir: "manual" により node_modules を見るため npm ci が要る。
      - run: npm ci
      # テストの無い member は deno test が "No test modules found" で exit 1 になるため、*.test.ts がある場合だけ実行する。
      - working-directory: modules/${{ matrix.module }}
        run: |
          deno task check
          deno lint
          deno fmt --check
          if find . -name '*.test.ts' -print -quit | grep -q .; then deno test -A; fi
